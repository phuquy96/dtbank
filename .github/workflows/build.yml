name: Build DTBank IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: 🚀 Build & Package DTBank IPA
    runs-on: macos-14

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Auto-Extract ZIP if uploaded
        run: |
          for f in *.zip; do
            if [ -f "$f" ] && [ "$f" != "*.zip" ]; then
              echo "Phát hiện $f, đang giải nén..."
              python3 -c "import zipfile; zipfile.ZipFile('$f').extractall('.')"
              ls -la
              break
            fi
          done

      - name: 🛠 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 📋 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Xcode Project
        run: xcodegen generate

      - name: 🏗 Build iOS App Archive
        run: |
          xcodebuild archive \
            -project DTBank.xcodeproj \
            -scheme DTBank \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/DTBank.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 📱 Package DTBank.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find "$PWD/build/DTBank.xcarchive/Products/Applications" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy file app!"
            exit 1
          fi
          echo "Tìm thấy App tại: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          
          cd build
          zip -qr "DTBank.ipa" Payload
          echo "✅ Đã tạo xong DTBank.ipa!"
          ls -lh DTBank.ipa

      - name: 📤 Upload Artifacts (DTBank-IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DTBank-IPA
          path: build/DTBank.ipa
          retention-days: 14

      - name: 🏷️ Create Release with direct .ipa download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "ĐTBank Mobile Release v1.0.${{ github.run_number }}"
          body: "🎉 File DTBank.ipa đã sẵn sàng cài đặt qua TrollStore, ESign, Scarlet, Sideloadly."
          files: build/DTBank.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
